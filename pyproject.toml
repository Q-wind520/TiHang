[project]
name = "tihang"
version = "1.0"
description = "题航/TiHang — 高度集成 LLM 的智能刷题软件"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "TiHang Team" }
]
keywords = ["exam", "practice", "coding", "llm", "ai", "education", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
dependencies = [
    "PySide6>=6.5.0",
    "Pygments>=2.15.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "PyPDF2>=3.0.0",
]

[project.scripts]
tihang = "run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["models*", "storage*", "llm*", "ui*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
